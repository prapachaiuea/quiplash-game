<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiplash</title>
  <meta name="description" content="The comedy answer-battle party game. Host it on a shared screen, play from your phone." />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <a class="back-home-pill" href="https://prapachaiuea.github.io/party-games/">&larr; All Games</a>
  <main class="split" id="split">
    <a class="panel panel-host" href="host.html">
      <div class="marquee-border" aria-hidden="true">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      </div>
      <div class="panel-inner">
        <p class="eyebrow eyebrow-host">On the shared screen</p>
        <h1 class="wordmark wordmark-host">QUIPLASH</h1>
        <p class="tagline tagline-host">Open a room, put this on the TV, laptop, or iPad everyone can see.</p>
        <span class="cta cta-host">Host a Room &rarr;</span>
      </div>
    </a>

    <a class="panel panel-player" href="player.html">
      <div class="panel-inner">
        <p class="eyebrow eyebrow-player">On your phone</p>
        <h1 class="wordmark wordmark-player">quiplash</h1>
        <p class="tagline tagline-player">Got a room code from the big screen? Grab your phone and join in.</p>
        <span class="cta cta-player">Join a Room &rarr;</span>
      </div>
    </a>
  </main>

  <script type="module" src="js/landing.js"></script>
</body>
</html>
